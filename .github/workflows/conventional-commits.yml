name: conventional-commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # description must start lowercase or with an acronym (CLI, API)
        run: |
          pattern='^(chore|ci|docs|feat|fix|perf|refactor|revert|security|style|test)(\([[:alnum:]][[:alnum:]./_-]*\))?!?: ([[:lower:]]|[[:upper:]][[:upper:][:digit:]]+([^[:alpha:]]|$))(.*[[:graph:]])?$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error title=Invalid pull request title::The title does not match the required format."
            printf 'Received title: %q\n' "$PR_TITLE"
            echo "Use: <type>[optional scope][optional !]: <description starting lowercase or with an acronym>"
            exit 1
          fi
