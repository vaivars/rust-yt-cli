ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant: needed by zbus 5, which secret-service (Linux keyring) still requires" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: needed by zbus 5, which secret-service (Linux keyring) still requires" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: needed by zbus 5, which secret-service (Linux keyring) still requires" },
]

[sources]
